[project]
name = "ausscrape"
version = "0.1.0"
description = "AU thoroughbred desk: racecards, sectionals, racing.com form, jev-ultrafast scrapes."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
jev = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
